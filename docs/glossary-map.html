<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cutex 桌面用语地图 / Desktop glossary map</title>
<style>
:root{--bg:#141518;--card:#1d1f23;--line:#33363c;--fg:#e3e3e3;--mute:#9aa0a6;--acc:#6aa9ff;--warn:#e0b45c;--old:#c99}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
h1{font-size:17px;margin:0;white-space:nowrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:3px 12px;font:inherit;cursor:pointer}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#0b1220}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 10px;font:inherit}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;display:none;z-index:40}
.results button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:6px 10px;font:inherit;cursor:pointer}
.results button:hover,.results button.on{background:#2a2d33}
.results small{color:var(--mute);margin-left:6px}
label.toggle{color:var(--mute);font-size:13px;white-space:nowrap;cursor:pointer}
main{padding:12px 16px}
.note{color:var(--mute);font-size:13px;margin:0 0 8px}
.stage{position:relative;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);user-select:none}
.stage img{display:block;width:100%;height:auto}
.r{scroll-margin-top:calc(var(--hdr,60px) + 8px);scroll-margin-bottom:8px;position:absolute;border-radius:4px;cursor:pointer;outline:0}
.r:hover,.r:focus-visible{background:rgba(106,169,255,.16);box-shadow:inset 0 0 0 2px var(--acc)}
.r.big:hover{background:rgba(106,169,255,.05)}
.r.sel{background:rgba(255,196,80,.18);box-shadow:inset 0 0 0 2px #ffc450}
.r.flash{animation:flash 1s ease-out 2}
@keyframes flash{50%{background:rgba(255,196,80,.45)}}
.stage.all .r{box-shadow:inset 0 0 0 1px rgba(106,169,255,.75)}
.stage.all .r.big{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tip{position:absolute;pointer-events:none;background:#000d;color:#fff;padding:2px 8px;border-radius:6px;font-size:13px;white-space:nowrap;z-index:5;display:none}
.tip small{color:#bbb;margin-left:6px}
.panel{scroll-margin-top:calc(var(--hdr,60px) + 8px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px 12px;box-shadow:0 10px 30px #000a}
.panel.float{position:absolute;z-index:30;width:300px;max-height:min(70vh,560px);overflow:auto}
.panel.dock{position:relative;margin-top:12px;max-width:720px}
.panel[hidden]{display:none}
.phead{display:flex;align-items:flex-start;gap:8px;padding-top:10px;cursor:move;touch-action:none}
.dock .phead{cursor:default}
.phead h2{font-size:19px;margin:0;flex:1;line-height:1.35}
.sec{color:var(--mute);font-weight:normal;margin-left:.35em;font-size:.85em}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px}
.chip{background:#262a31;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;line-height:1.7}
.chip:hover{border-color:var(--acc)}
.chip .sec{font-size:12px}
.panel details{margin:4px 0 2px;color:var(--mute);font-size:13px}
.panel summary{cursor:pointer;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel summary::-webkit-details-marker{display:none}
.panel details[open] summary{white-space:normal}
.copies{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.copies .copy{margin:0}
.copy.alt{background:none;border:1px solid var(--acc);color:var(--acc)}
.scr{color:var(--mute);font-size:12px;margin-top:6px}
.scr .link{font-size:12px}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px}
.x:hover{color:var(--fg)}
.panel .en{color:var(--mute);font-size:13px}
.panel .alias{color:var(--mute);font-size:13px;margin-top:2px}
.panel p{margin:8px 0}
.badge{display:inline-block;font-size:12px;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:3px;font-weight:normal}
.badge.progress{background:#3a3220;color:var(--warn);border:1px solid #6b5a33}
.badge.legacy{background:#3a2626;color:var(--old);border:1px solid #6b3c3c}
.panel h3{font-size:12px;color:var(--mute);margin:8px 0 3px;font-weight:600}
.panel ul{margin:0;padding-left:0;list-style:none}
.panel li{margin:2px 0}
.link{background:none;border:0;color:var(--acc);padding:0;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.copy{margin-top:10px;background:var(--acc);color:#0b1220;border:0;border-radius:8px;padding:4px 12px;font:inherit;cursor:pointer}
.copied{color:#7fd18b;font-size:13px;margin-left:8px}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:16px}
.list button{text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.list button:hover{border-color:var(--acc)}
.list button.sel{border-color:#ffc450}
.list small{display:block;color:var(--mute);font-size:12px}
.list .sec{font-size:13px}
.group h3{font-size:14px;margin:6px 0}
footer{color:var(--mute);font-size:12px;padding:0 16px 16px}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="seg" role="tablist" id="tabs"></div>
  <div class="search"><input id="q" type="search" autocomplete="off"><div class="results" id="results" role="listbox"></div></div>
  <label class="toggle"><input type="checkbox" id="showAll"> <span id="showAllText"></span></label>
  <div class="seg" id="lang" role="group" aria-label="语言 / Language"><button data-lang="zh">中文</button><button data-lang="en">English</button></div>
</header>
<main>
  <section id="view"></section>
  <p class="hint" id="hint"></p>
  <div id="dockSlot"></div>
</main>
<footer id="foot"></footer>
<div class="panel float" id="panel" hidden role="dialog" aria-live="polite"></div>

<script>
(() => {
  const data = JSON.parse(document.getElementById("glossary-data").textContent);
  const parts = data.parts, screens = data.screens, big = new Set(data.containers), UI = data.ui;
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) if (k != null) e.append(k); return e; };
  const OTHER = "other";
  // Language: remembered in localStorage when the page may use it (an opaque sandbox frame may not), else in memory.
  const store = { get() { try { return localStorage.getItem("glossary-map.lang"); } catch { return null; } }, set(v) { try { localStorage.setItem("glossary-map.lang", v); } catch {} } };
  let lang = store.get() === "en" ? "en" : "zh";
  const t = (k) => UI[lang][k];
  const nm = (id, l = lang) => parts[id][l].name;
  const otherLang = () => (lang === "zh" ? "en" : "zh");
  const bi = (id) => [nm(id), el("span", { class: "sec" }, nm(id, otherLang()))];
  const both = (id) => (nm(id) === nm(id, otherLang()) ? nm(id) : nm(id) + " " + nm(id, otherLang()));
  const screensOf = (id) => screens.filter((s) => s.regions.some((r) => r.part === id));
  let current = screens[0].id, selected = null, anchorEl = null, dragged = false;

  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    $("#title").textContent = t("title"); $("#q").placeholder = t("searchPlaceholder"); $("#q").setAttribute("aria-label", t("search"));
    $("#showAllText").textContent = t("showAll"); $("#hint").textContent = t("hint"); $("#foot").textContent = t("footer");
    for (const b of $("#lang").children) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    const tabs = $("#tabs"); tabs.textContent = "";
    for (const s of [...screens, { id: OTHER, title: { zh: UI.zh.other, en: UI.en.other } }]) tabs.append(el("button", { role: "tab", "data-tab": s.id, "aria-selected": String(s.id === current), onclick: () => { closePanel(); show(s.id); } }, s.title[lang]));
  }
  for (const b of $("#lang").children) b.addEventListener("click", () => { lang = b.dataset.lang; store.set(lang); applyLang(); hdr(); show(current); if (selected && !$("#panel").hidden) openPanel(selected, findAnchor(selected)); search(); });

  function show(id, flashPart) {
    current = id;
    for (const b of $("#tabs").children) b.setAttribute("aria-selected", String(b.dataset.tab === id));
    const view = $("#view"); view.textContent = "";
    if (id === OTHER) { renderOther(view); return; }
    const s = screens.find((x) => x.id === id);
    view.append(el("p", { class: "note" }, s.title[lang] + " — " + s.note[lang]));
    const stage = el("div", { class: "stage" + ($("#showAll").checked ? " all" : ""), id: "stage" });
    const img = document.getElementById("img-" + s.id).cloneNode(); img.removeAttribute("id"); img.alt = s.title[lang]; img.hidden = false;
    stage.append(img);
    const tip = el("div", { class: "tip" });
    for (const r of s.regions.slice().sort((a, b) => b.w * b.h - a.w * a.h)) {
      const d = el("div", { class: "r" + (big.has(r.part) ? " big" : "") + (r.part === selected ? " sel" : ""), "data-part": r.part, tabindex: "0", role: "button", "aria-label": nm(r.part) });
      Object.assign(d.style, { left: r.x + "%", top: r.y + "%", width: r.w + "%", height: r.h + "%" });
      d.addEventListener("mouseenter", () => { tip.textContent = nm(r.part); tip.append(el("small", {}, nm(r.part, lang === "zh" ? "en" : "zh"))); tip.style.display = "block"; tip.style.left = Math.min(r.x, 78) + "%"; tip.style.top = r.y + r.h < 92 ? `calc(${r.y + r.h}% + 4px)` : `calc(${r.y}% - 26px)`; });
      d.addEventListener("mouseleave", () => { tip.style.display = "none"; });
      d.addEventListener("click", (e) => { e.stopPropagation(); select(r.part, d); });
      d.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(r.part, d); } });
      stage.append(d);
    }
    stage.append(tip);
    view.append(stage);
    if (flashPart) for (const d of stage.querySelectorAll(`[data-part="${flashPart}"]`)) d.classList.add("flash");
  }
  function renderOther(view) {
    view.append(el("p", { class: "note" }, t("otherNote")));
    for (const g of data.groups) {
      const list = el("div", { class: "list" });
      for (const id of g.parts) { const b = el("button", { class: id === selected ? "sel" : "", "data-part": id }, ...bi(id)); b.addEventListener("click", () => select(id, b)); list.append(b); }
      view.append(el("div", { class: "group" }, el("h3", {}, g.title[lang]), list));
    }
  }
  function findAnchor(id) { return document.querySelector(`#view [data-part="${id}"]`); }
  function goTo(id) {
    const on = screensOf(id);
    let target = current;
    if (!(current !== OTHER && on.some((s) => s.id === current))) target = on.length ? on[0].id : OTHER;
    if (target !== current) show(target, id);
    const a = findAnchor(id);
    if (a) { a.scrollIntoView({ block: "nearest" }); if (target === current) { a.classList.remove("flash"); void a.offsetWidth; a.classList.add("flash"); } }
    select(id, a);
  }
  function select(id, anchor) {
    selected = id;
    for (const d of document.querySelectorAll("#view [data-part]")) d.classList.toggle("sel", d.dataset.part === id);
    history.replaceState(null, "", "#part=" + id);
    openPanel(id, anchor || findAnchor(id));
  }

  // ---- floating panel ----
  const panel = $("#panel");
  function openPanel(id, anchor) {
    anchorEl = anchor; dragged = false;
    renderPanel(id);
    panel.hidden = false;
    place();
  }
  function closePanel() { panel.hidden = true; selected = null; for (const d of document.querySelectorAll("#view .sel")) d.classList.remove("sel"); history.replaceState(null, "", location.pathname + location.search); }
  // Beside the part, never over it, inside the window; if no such spot exists (the part is nearly the whole picture,
  // or the window is too small) the panel drops below the picture instead.
  function place() {
    if (panel.hidden) return;
    const vw = document.documentElement.clientWidth, vh = innerHeight, top0 = $("header").getBoundingClientRect().bottom + 8, m = 8;
    floatMode(true);
    const pw = Math.min(300, vw - 2 * m); panel.style.width = pw + "px"; panel.style.left = "0px"; panel.style.top = "0px";
    const ph = panel.getBoundingClientRect().height;
    const rects = anchorEl ? [...document.querySelectorAll(`#view [data-part="${anchorEl.dataset.part}"]`)].map((e) => e.getBoundingClientRect()) : [];
    const A = anchorEl ? anchorEl.getBoundingClientRect() : null;
    const hit = (x, y) => rects.some((r) => x < r.right && x + pw > r.left && y < r.bottom && y + ph > r.top);
    const fits = (x, y) => x >= m && y >= top0 && x + pw <= vw - m && y + ph <= vh - m;
    const clampX = (x) => Math.max(m, Math.min(vw - m - pw, x)), clampY = (y) => Math.max(top0, Math.min(vh - m - ph, y));
    let spot = null;
    if (A && A.bottom > top0 && A.top < vh) {
      const room = ([x, y]) => Math.min(x - m, vw - m - (x + pw), y - top0, vh - m - (y + ph));
      const cands = [[A.right + 10, clampY(A.top)], [A.left - 10 - pw, clampY(A.top)], [clampX(A.left), A.bottom + 10], [clampX(A.left), A.top - 10 - ph]];
      cands.sort((a, b) => room(b) - room(a));
      spot = cands.find(([x, y]) => fits(x, y) && !hit(x, y));
    }
    if (!spot) { floatMode(false); panel.scrollIntoView({ block: "nearest" }); return; }
    panel.style.left = spot[0] + scrollX + "px"; panel.style.top = spot[1] + scrollY + "px";
  }
  function floatMode(on) {
    panel.classList.toggle("float", on); panel.classList.toggle("dock", !on);
    if (on && panel.parentElement !== document.body) document.body.append(panel);
    if (!on) { panel.style.width = ""; panel.style.left = ""; panel.style.top = ""; $("#dockSlot").append(panel); }
    panel.dataset.mode = on ? "float" : "dock";
  }
  addEventListener("resize", () => { if (!dragged) place(); });
  // Drag by the header (floating only).
  panel.addEventListener("pointerdown", (e) => {
    if (!panel.classList.contains("float") || !e.target.closest(".phead") || e.target.closest("button")) return;
    const sx = e.pageX - panel.offsetLeft, sy = e.pageY - panel.offsetTop; panel.setPointerCapture(e.pointerId);
    const move = (ev) => { dragged = true; const vw = document.documentElement.clientWidth, top0 = scrollY + $("header").offsetHeight + 4; const x = Math.max(scrollX + 4, Math.min(scrollX + vw - panel.offsetWidth - 4, ev.pageX - sx)), y = Math.max(top0, Math.min(scrollY + innerHeight - panel.offsetHeight - 4, ev.pageY - sy)); panel.style.left = x + "px"; panel.style.top = y + "px"; };
    const up = () => { panel.removeEventListener("pointermove", move); panel.removeEventListener("pointerup", up); };
    panel.addEventListener("pointermove", move); panel.addEventListener("pointerup", up);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden && document.activeElement !== $("#q")) closePanel(); });

  function renderPanel(id) {
    const p = parts[id], L = p[lang]; panel.textContent = ""; panel.dataset.part = id;
    const h = el("h2", {}, ...bi(id));
    if (p.status === "progress") h.append(el("span", { class: "badge progress" }, t("inProgress")));
    if (p.status === "legacy") h.append(el("span", { class: "badge legacy" }, t("legacy")));
    panel.setAttribute("aria-label", both(id));
    panel.append(el("div", { class: "phead" }, h, el("button", { class: "x", "aria-label": t("close"), title: t("close") + " (Esc)", onclick: closePanel }, "×")));
    if (L.aliases && L.aliases.length) panel.append(el("div", { class: "alias" }, t("aliases") + L.aliases.join(lang === "zh" ? "、" : ", ")));
    // The description is one quiet line; click it to read it all.
    panel.append(el("details", {}, el("summary", { title: t("more") }, L.what)));
    const chip = (nid, title) => el("button", { class: "chip", "data-go": nid, title: title || "", onclick: () => goTo(nid) }, ...bi(nid));
    if (p.near.length) panel.append(el("h3", {}, t("near")), el("div", { class: "chips" }, ...p.near.map((n) => chip(n.id, n[lang]))));
    const on = screensOf(id), s = on.find((x) => x.id === current) || on[0];
    if (s) {
      const inside = (a, b) => a.part !== b.part && a.x >= b.x - 0.3 && a.y >= b.y - 0.3 && a.x + a.w <= b.x + b.w + 0.3 && a.y + a.h <= b.y + b.h + 0.3 && a.w * a.h < b.w * b.h;
      const parentOf = (r) => s.regions.filter((o) => inside(r, o)).sort((a, b) => a.w * a.h - b.w * b.h)[0];
      const mine = s.regions.filter((r) => r.part === id);
      const parent = mine.map(parentOf).find(Boolean);
      const kids = [...new Set(s.regions.filter((r) => mine.includes(parentOf(r))).map((r) => r.part))];
      if (parent) panel.append(el("h3", {}, t("parent")), el("div", { class: "chips" }, chip(parent.part)));
      if (kids.length) panel.append(el("h3", {}, t("children")), el("div", { class: "chips" }, ...kids.map((k) => chip(k))));
    }
    if (on.length) { const line = el("div", { class: "scr" }, t("screens") + " "); on.forEach((sc, i) => { if (i) line.append(" · "); line.append(el("button", { class: "link", onclick: () => { show(sc.id, id); select(id, findAnchor(id)); } }, sc.title[lang])); }); panel.append(line); }
    const msg = el("span", { class: "copied" });
    panel.append(el("div", { class: "copies" }, el("button", { class: "copy", "data-copy": "one", onclick: () => copy(L.name, msg) }, t("copy").replace("{name}", L.name)), el("button", { class: "copy alt", "data-copy": "both", title: both(id), onclick: () => copy(both(id), msg) }, t("copyBoth")), msg));
  }
  function copy(text, msg) {
    const done = () => { msg.textContent = t("copied"); setTimeout(() => (msg.textContent = ""), 1500); };
    const fallback = () => { const ta = el("textarea"); ta.value = text; document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove(); ok ? done() : (msg.textContent = t("copyFailed")); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  // ---- search: both languages, whatever is selected ----
  const q = $("#q"), results = $("#results");
  const norm = (s) => s.toLowerCase().replace(/\s+/g, "");
  let hits = [], cursor = 0;
  function search() {
    const v = norm(q.value); results.textContent = "";
    if (!v) { results.style.display = "none"; return; }
    hits = Object.keys(parts).filter((id) => ["zh", "en"].some((l) => [parts[id][l].name, ...(parts[id][l].aliases || [])].some((s) => norm(s).includes(v)))).slice(0, 30);
    cursor = 0;
    if (!hits.length) results.append(el("div", { style: "padding:6px 10px;color:var(--mute)" }, t("noHits")));
    const other = lang === "zh" ? "en" : "zh";
    hits.forEach((id, i) => results.append(el("button", { role: "option", class: i === 0 ? "on" : "", onclick: () => pick(id) }, ...bi(id), (parts[id][lang].aliases || []).length ? el("small", {}, (parts[id][lang].aliases).join(" · ")) : null)));
    results.style.display = "block";
  }
  function pick(id) { results.style.display = "none"; q.value = ""; q.blur(); goTo(id); }
  q.addEventListener("input", search);
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); cursor = Math.max(0, Math.min(hits.length - 1, cursor + (e.key === "ArrowDown" ? 1 : -1))); [...results.children].forEach((b, i) => b.classList.toggle("on", i === cursor)); }
    if (e.key === "Enter" && hits[cursor]) pick(hits[cursor]);
    if (e.key === "Escape") { results.style.display = "none"; q.blur(); }
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) results.style.display = "none"; });
  $("#showAll").addEventListener("change", (e) => { const s = $("#stage"); if (s) s.classList.toggle("all", e.target.checked); });

  const hdr = () => document.documentElement.style.setProperty("--hdr", $("header").offsetHeight + "px");
  addEventListener("resize", hdr);
  applyLang(); hdr();
  const m = /part=([\w-]+)/.exec(location.hash);
  show(current);
  if (m && parts[m[1]]) goTo(m[1]);
})();
</script>
</body>
</html>
