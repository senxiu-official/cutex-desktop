<main>
  <h1>Desk note</h1>
  <p>A local note kept in this plugin's own settings.</p>
  <label for="note">Your note</label>
  <textarea id="note" rows="12" placeholder="Write a note…"></textarea>
  <button id="save" type="button">Save note</button>
  <p id="status" role="status">Loading…</p>
</main>
